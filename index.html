<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Work Order Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --bg:#f3f0f4; --panel:#ffffff; --ink:#3d2430; --muted:#946b7a; --faint:#c19aab;
  --line:#f6d9e6; --line2:#fcecf3; --tap:#e0348a; --tap2:#c21f70;
  /* status + flag colors — unchanged on purpose */
  --pastdue:#d92d20; --duesoon:#e8820c; --rush:#7c3aed; --followup:#c99700;
  --motion:#0f9d6b; --done:#7c8a99; --ok:#9aa9b6; --action:#2456d6;
  --over:#d92d20; --near:#e8820c; --under:#0f9d6b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:92px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.qs{font-family:'Quicksand',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:inherit}

/* header */
.top{position:sticky;top:0;z-index:30;color:#fff;
  background:linear-gradient(135deg,#c21f70 0%,#ec4f9d 60%,#f47cb8 100%);
  padding:calc(env(safe-area-inset-top) + 13px) 16px 13px;box-shadow:0 3px 16px rgba(194,31,112,.28)}
.top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px;font-family:'Quicksand'}
.top h1 .bloom{font-size:17px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.mode{margin-left:auto;font-size:11px;font-weight:600;color:#ffe3f1;display:flex;align-items:center;gap:5px;font-family:'IBM Plex Sans'}
.mode b{color:#fff}
.back{display:inline-flex;align-items:center;gap:7px;font-family:'Quicksand';font-weight:600;font-size:16px;color:#fff}
.back svg{width:20px;height:20px}

/* tabs */
.tabs{display:flex;gap:4px;margin-top:13px;background:rgba(255,255,255,.16);padding:4px;border-radius:12px}
.tab{flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-family:'Quicksand';font-weight:700;font-size:13.5px;color:#ffe3f1}
.tab.on{background:#fff;color:var(--tap2);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* triage */
.triage{display:flex;gap:8px;margin-top:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.tcard{flex:0 0 auto;min-width:78px;border-radius:13px;padding:9px 12px;text-align:left;color:#fff;transition:transform .08s,filter .12s}
.tcard:active{transform:scale(.96)}
.tcard.off{filter:grayscale(.5) brightness(.85);opacity:.72}
.tcard .n{font-size:22px;font-weight:700;line-height:1;font-family:'IBM Plex Mono'}
.tcard .l{font-size:10.5px;font-weight:600;margin-top:4px;opacity:.95}
.tcard.clear{background:rgba(255,255,255,.2);color:#fff}

/* rush box */
.rushbox{max-width:860px;margin:12px auto 0;padding:0 16px}
.rushbox .inner{background:#fff;border:1.5px solid #e2d8f7;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(224,52,138,.08)}
.rushbox h3{margin:0;font-family:'Quicksand';font-weight:700;font-size:13px;color:var(--rush);
  padding:11px 14px;display:flex;align-items:center;gap:8px;background:#f4f0fc}
.rushbox h3 .cnt{margin-left:auto;background:var(--rush);color:#fff;font-family:'IBM Plex Mono';font-size:12px;padding:2px 8px;border-radius:20px}
.rushline{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line2)}
.rushline:active{background:var(--line2)}
.rushline .wo{font-family:'IBM Plex Mono';font-weight:600;font-size:13.5px}
.rushline .lc{font-size:12px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rushline .fl{font-size:10px;font-weight:700;color:#fff;padding:2px 7px;border-radius:5px}

/* controls */
.controls{padding:12px 16px 4px;display:flex;flex-direction:column;gap:9px;max-width:860px;margin:0 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search input{border:none;outline:none;flex:1;background:none;color:var(--ink)}
.search svg{color:var(--faint)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.sel{position:relative;flex:0 0 auto}
.sel select{appearance:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;height:38px;padding:0 30px 0 12px;font-size:13px;font-weight:600;color:var(--ink);outline:none}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* list + cards */
.list{padding:10px 16px 20px;display:flex;flex-direction:column;gap:11px;max-width:860px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;box-shadow:0 2px 8px rgba(194,31,112,.06)}
.card:active{transform:translateY(1px)}
.rail{flex:0 0 6px;align-self:stretch}
.cbody{flex:1;min-width:0;padding:12px 13px 11px}
.r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.3px;color:#fff;padding:3px 8px;border-radius:6px;white-space:nowrap}
.pill{font-size:11px;font-weight:600;color:var(--muted);background:var(--line2);padding:3px 8px;border-radius:6px}
.wo{font-size:15px;font-weight:600}
.spacer{flex:1}
.r2{margin-top:7px;font-size:13.5px;color:var(--muted);line-height:1.4}
.r2 .loc{color:var(--ink);font-weight:500}
.scope{margin-top:5px;font-size:13.5px;color:var(--ink);line-height:1.42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:9px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
.meta b{color:var(--muted);font-weight:600}
.meta .due.late{color:var(--pastdue);font-weight:600}
.budgetbadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff}
.next{margin-top:9px;font-size:13px;color:var(--ink);background:#fdf2f7;border-left:3px solid var(--line);padding:7px 9px;border-radius:0 8px 8px 0;line-height:1.4}
.acts{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:600;border:1px solid var(--line);color:var(--muted);background:#fff}
.act:active{background:var(--line2)}
.act.call{border-color:#bfe6d5;color:#0b7a53;background:#eefaf4}
.act.log{border-color:#f4cbe0;color:var(--tap2);background:#fdeef6}
.act svg{width:15px;height:15px}
.tapopen{cursor:pointer}

/* detail */
.detail{max-width:760px;margin:0 auto;padding:14px 16px 30px}
.dhead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 2px 8px rgba(194,31,112,.06)}
.dhead .top1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dhead h2{margin:6px 0 0;font-size:20px;font-family:'Quicksand';font-weight:700}
.dhead .loc{margin-top:3px;color:var(--muted);font-size:14px}
.dscope{margin-top:11px;font-size:15px;line-height:1.5}
.sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:13px;box-shadow:0 2px 8px rgba(194,31,112,.05)}
.sec h4{margin:0 0 11px;font-family:'Quicksand';font-weight:700;font-size:14px;color:var(--tap2);display:flex;align-items:center;gap:8px}
.sec h4 .r{margin-left:auto;font-family:'IBM Plex Sans';font-weight:600;font-size:12px;color:var(--faint)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14px}
.kv dt{color:var(--faint);font-weight:600}
.kv dd{margin:0}
.sublink{color:var(--tap);font-weight:700;text-decoration:underline;text-underline-offset:2px}

/* budget bar */
.bbar{height:12px;border-radius:8px;background:var(--line2);overflow:hidden;margin:4px 0 8px}
.bbar span{display:block;height:100%;border-radius:8px}
.bnums{display:flex;justify-content:space-between;font-size:13px}
.bnums b{font-family:'IBM Plex Mono';font-weight:600}
.bwarn{margin-top:8px;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px}

/* log */
.logadd{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.logadd textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:56px;resize:vertical;outline:none;line-height:1.4}
.logadd textarea:focus{border-color:var(--tap);box-shadow:0 0 0 3px rgba(224,52,138,.12)}
.logadd button{align-self:flex-end;background:var(--tap);color:#fff;font-weight:700;font-size:13px;padding:8px 16px;border-radius:9px}
.logentry{border-left:3px solid var(--line);padding:2px 0 12px 12px;position:relative}
.logentry:last-child{padding-bottom:2px}
.logentry .ts{font-family:'IBM Plex Mono';font-size:11px;color:var(--tap);font-weight:600}
.logentry .tx{font-size:13.5px;margin-top:3px;line-height:1.45;white-space:pre-wrap}
.logentry.legacy .ts{color:var(--faint)}
.hist{font-size:13px;color:var(--muted);line-height:1.55;white-space:pre-wrap}

/* subs */
.subrow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:0 2px 8px rgba(194,31,112,.05)}
.subrow:active{background:var(--line2)}
.subrow .nm{font-family:'Quicksand';font-weight:700;font-size:16px;color:var(--tap2)}
.subrow .tr{font-size:12.5px;color:var(--muted);margin-top:2px}
.subrow .ct{font-size:12.5px;color:var(--faint);margin-top:6px}
.jobmini{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2);font-size:13px}
.jobmini:active{opacity:.6}
.jobmini .fl{font-size:9.5px;font-weight:700;color:#fff;padding:2px 6px;border-radius:5px}
.jobmini .wo{font-family:'IBM Plex Mono';font-weight:600}
.jobmini .loc{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rowbtns{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:11px;font-weight:700;font-size:13.5px}
.btn.pri{background:var(--tap);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--muted)}
.btn.done{background:#e7f7f0;border:1px solid #bfe6d5;color:#0b7a53}
.btn.del{background:#fff;border:1px solid #f3c9c6;color:var(--pastdue)}

.empty{max-width:760px;margin:44px auto;text-align:center;color:var(--muted);padding:0 24px}
.empty h3{color:var(--ink);font-size:16px;margin:0 0 6px;font-family:'Quicksand'}

.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:40;height:56px;padding:0 22px 0 18px;border-radius:18px;background:var(--tap);color:#fff;font-weight:700;font-size:15px;font-family:'Quicksand';display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(224,52,138,.42)}
.fab:active{transform:translateY(1px)}
.foot{max-width:760px;margin:6px auto 30px;padding:0 16px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.foot button{font-size:12px;font-weight:600;color:var(--faint)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(61,36,48,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0}
@media(min-width:640px){.sheet{border-radius:18px}}
.sheet header{position:sticky;top:0;color:#fff;background:linear-gradient(135deg,#c21f70,#ec4f9d);padding:15px 18px;display:flex;align-items:center;gap:12px;z-index:2}
.sheet header h2{margin:0;font-size:16px;font-weight:700;flex:1;font-family:'Quicksand'}
.sheet header .x{font-size:22px;color:#ffdcee;line-height:1}
.form{padding:16px 18px 24px}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;color:var(--ink);outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--tap);box-shadow:0 0 0 3px rgba(224,52,138,.12)}
.fg textarea{min-height:70px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.rushtog{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.rushtog input{width:20px;height:20px;accent-color:var(--rush)}
.rushtog span{font-size:13.5px;font-weight:600}
.save{width:100%;height:50px;border-radius:13px;background:var(--tap);color:#fff;font-size:15px;font-weight:700;font-family:'Quicksand';margin-top:6px}
.save:active{transform:translateY(1px)}
.hint{font-size:12px;color:var(--faint);line-height:1.5;margin:2px 0 14px}
.syncbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:2px 0 12px;font-size:13px;line-height:1.5;color:var(--muted)}
.syncbox code{font-family:'IBM Plex Mono';background:var(--line2);padding:1px 5px;border-radius:4px;font-size:11.5px;color:var(--ink);display:inline-block}
.syncbox b{color:var(--ink)}
.picker{display:flex;gap:8px}
.picker select{flex:1}
.picker button{flex:0 0 auto;background:var(--tap);color:#fff;border-radius:10px;padding:0 14px;font-weight:700;font-size:13px}
.noteedit{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;min-height:90px;resize:vertical;outline:none;line-height:1.5;font-size:13.5px;color:var(--ink);font-family:'IBM Plex Sans'}
.noteedit:focus{border-color:var(--tap);box-shadow:0 0 0 3px rgba(224,52,138,.12)}
.contactcard{padding:9px 0;border-top:1px solid var(--line2)}
.contactcard:first-of-type{border-top:none;padding-top:0}
.contactcard .cn{font-weight:600;font-size:14px}
.contactcard .cd{font-size:13px;color:var(--muted);margin-top:2px}
.jobno{font-size:12px;color:var(--faint);font-weight:500;font-family:'IBM Plex Mono'}
.wowrap{text-align:right}
.actionpick{margin-top:12px;display:flex;align-items:center;gap:10px}
.actionpick label{font-size:12px;font-weight:700;color:var(--action)}
.actionpick select{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:9px;height:40px;padding:0 10px;font-size:13.5px;font-weight:600;color:var(--action);outline:none}
.actionpick select:focus{border-color:var(--action);box-shadow:0 0 0 3px rgba(36,86,214,.12)}
.suggest{background:#eef3fe;border:1px solid #cdddfb;color:var(--action);font-size:13px;font-weight:600;padding:9px 11px;border-radius:10px;margin-bottom:12px;cursor:pointer}
.suggest b{text-transform:capitalize}
.bid{border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:10px;background:#fff}
.bidhead{display:flex;align-items:center;gap:8px}
.bidname{font-weight:700;font-size:14px}
.chosentag{font-size:11px;font-weight:700;color:#fff;background:var(--motion);padding:2px 8px;border-radius:6px}
.biddrop{color:var(--faint);font-size:16px;padding:2px 7px;margin-left:auto}
.bidctl{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.bidctl .sel select{height:36px}
.bidcall{height:36px}
.bidchoose{height:36px;padding:0 14px;border-radius:9px;background:var(--tap);color:#fff;font-weight:700;font-size:12.5px}
.bidnote{width:100%;margin-top:9px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:13px;color:var(--ink);outline:none}
.bidnote:focus{border-color:var(--tap);box-shadow:0 0 0 3px rgba(224,52,138,.1)}
.chosenmini{color:#e0348a;font-size:14px;margin-left:auto}
.bidmini{font-size:11px;color:var(--muted);background:var(--line2);padding:2px 7px;border-radius:5px;margin-left:auto}
.emptyheart{font-size:46px;color:#f4a9c9;line-height:1;margin-bottom:8px}
.trlabel{font-size:9.5px;font-weight:700;letter-spacing:.7px;color:#ffd4ea;text-transform:uppercase;margin:12px 2px 0}
.trlabel:first-of-type{margin-top:13px}
</style>
</head>

/* ---------------- flags (unchanged logic) ---------------- */
const FLAG={
 past_due:{key:"past_due",label:"PAST DUE",color:"var(--pastdue)"},
 due_soon:{key:"due_soon",label:"DUE SOON",color:"var(--duesoon)"},
 follow_up:{key:"follow_up",label:"GONE QUIET",color:"var(--followup)"},
 in_motion:{key:"in_motion",label:"IN MOTION",color:"var(--motion)"},
 done:{key:"done",label:"DONE",color:"var(--done)"},
 ok:{key:"ok",label:"ON TRACK",color:"var(--ok)"}
};
const DAY=86400000;
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function parseD(s){if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function db(a,b){return Math.round((a-b)/DAY);}
function bizDays(a,b){if(!a||!b||b<=a)return 0;let n=0,i=0;const d=new Date(a);while(d<b&&i<500){d.setDate(d.getDate()+1);const wd=d.getDay();if(wd!==0&&wd!==6)n++;i++;}return n;}
function statusFlag(w,cfg){
  const t=today();
  if(w.status==="Complete")return {...FLAG.done};
  const due=parseD(w.due), lc=parseD(w.lastContact);
  const active=["Scheduled","In Progress","Parts Ordered"].includes(w.status);
  if(due&&due<t&&!active)return {...FLAG.past_due,extra:db(t,due)+"d late"};
  if(due&&due>=t&&db(due,t)<=cfg.dueSoon&&!active)return {...FLAG.due_soon,extra:"in "+db(due,t)+"d"};
  const ref=lc||parseD(w.createdAt);
  if(ref&&!active){const qd=bizDays(ref,t);if(qd>=cfg.followUp)return {...FLAG.follow_up,extra:qd+"d quiet"};}
  if(["Scheduled","In Progress"].includes(w.status))return {...FLAG.in_motion};
  return {...FLAG.ok};
}
function severity(w,cfg){
  const f=statusFlag(w,cfg).key;
  const base={past_due:0,due_soon:2,follow_up:3,in_motion:4,ok:5,done:7}[f];
  return w.rush&&w.status!=="Complete"?Math.min(base,1):base;
}
function daysQuiet(w){const lc=parseD(w.lastContact);if(!lc)return null;return db(today(),lc);}
function num(v){if(v==null)return NaN;const n=parseFloat(String(v).replace(/[^0-9.]/g,""));return isNaN(n)?NaN:n;}
function budgetState(w){
  const b=num(w.budget), a=num(w.actual);
  if(isNaN(b)||b<=0||isNaN(a))return null;
  const pct=a/b;
  let key="under",color="var(--under)",msg="";
  if(a>b){key="over";color="var(--over)";msg="Over budget by "+money(a-b)+" — needs Sentry approval.";}
  else if(pct>=0.9){key="near";color="var(--near)";msg="At "+Math.round(pct*100)+"% of budget — watch the cap.";}
  return {key,color,pct:Math.min(pct,1),b,a,msg};
}
function money(n){return "$"+n.toLocaleString(undefined,{maximumFractionDigits:2});}
function fmtDate(s){if(!s)return "";const[y,m,d]=s.split("-");return (+m)+"/"+(+d)+"/"+String(y).slice(2);}
function todayStr(){const t=today();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");}
function fmtDT(iso){const d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+", "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

const WKEY="wo_board_v3", SKEY="wo_subs_v3", CKEY="wo_cfg_v2";
let memW=null,memS=null;
function lGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
const sync=!!(window.SUPABASE_URL&&window.SUPABASE_ANON_KEY);
let sb=null;
async function loadSB(){if(!window.supabase){await new Promise((res,rej)=>{const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
  sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);}
async function initStore(){
  if(sync){try{await loadSB();
    let {data:wd}=await sb.from("work_orders").select("*").order("created_at",{ascending:true});
    let {data:sd}=await sb.from("subs").select("*").order("created_at",{ascending:true});
    if(!sd||sd.length===0){sd=SUB_SEED.map(s=>({...s}));await sb.from("subs").insert(sd);}
    if(!wd||wd.length===0){wd=SEED.map(s=>({...s,id:uid()}));await sb.from("work_orders").insert(wd);}
    wd=wd.map(w=>({...w,log:w.log||[],createdAt:w.createdAt||todayStr()}));
    sd=sd.map(x=>x.contacts?x:{...x,contacts:[{name:x.contactName||"",phone:x.phone||"",email:x.email||""}]});
    return {rows:wd,subs:sd};
  }catch(e){console.warn("sync failed → local",e);}}
  const rw=lGet(WKEY), rs=lGet(SKEY);
  let rows=rw?safe(rw):null, subs=rs?safe(rs):null;
  if(!rows){rows=memW||SEED.map(s=>({...s,id:uid()}));}
  if(!subs){subs=memS||SUB_SEED.map(s=>({...s}));}
  rows=rows.map(w=>({...w,log:w.log||[],createdAt:w.createdAt||todayStr()}));
  subs=subs.map(x=>x.contacts?x:{...x,contacts:[{name:x.contactName||"",phone:x.phone||"",email:x.email||""}]});
  persistW(rows);persistS(subs);
  return {rows,subs};
}
function safe(s){try{return JSON.parse(s);}catch(e){return null;}}
function persistW(r){memW=r;lSet(WKEY,JSON.stringify(r));}
function persistS(s){memS=s;lSet(SKEY,JSON.stringify(s));}
async function saveW(rows,row){persistW(rows);if(sync&&sb)try{await sb.from("work_orders").upsert(row);}catch(e){}}
async function delW(rows,id){persistW(rows);if(sync&&sb)try{await sb.from("work_orders").delete().eq("id",id);}catch(e){}}
async function saveS(subs,sub){persistS(subs);if(sync&&sb)try{await sb.from("subs").upsert(sub);}catch(e){}}

         <div className="bbar"><span style={{width:(bs.pct*100)+"%",background:bs.color}}/></div>
         <div className="bnums"><span>Actual <b>{money(bs.a)}</b></span><span>Budget <b>{money(bs.b)}</b></span></div>
         {bs.msg&&<div className="bwarn" style={{background:bs.key==="over"?"#fdeceb":"#fdf3e8",color:bs.color}}>{bs.msg}</div>}

     <div className="sec">

       </div>

        :log.map((e,i)=><div key={i} className={"logentry"+(e.legacy?" legacy":"")}>
            <div className="ts">{e.legacy?"Imported from notes":fmtDT(e.ts)}</div>
            <div className="tx">{e.text}</div></div>)}
     </div>

     <div className="sec">
       <h4>Notes <span className="r">freeform · not logged</span></h4>
       <textarea className="noteedit" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Freeform notes for this order — edit anytime. Not timestamped."/>
       {notes!==(w.history||"")&&<button className="btn pri" style={{marginTop:9}} onClick={()=>onSaveNotes(w,notes)}>Save note</button>}
     </div>

     <div className="rowbtns">
       {w.status!=="Complete"
        ? <button className="btn done" onClick={()=>onComplete(w)}>Mark complete</button>
        : <button className="btn ghost" onClick={()=>onReopen(w)}>Reopen</button>}
       <button className="btn del" onClick={()=>onDelete(w)}>Delete</button>
     </div>
   </div>
  );
}

        ?<div style={{fontSize:13,color:"var(--faint)"}}>No contacts yet — add up to 3 in Edit.</div>

       {sub.address&&<div style={{marginTop:11,fontSize:13,color:"var(--muted)"}}><b style={{color:"var(--faint)",fontWeight:600}}>Address </b>{sub.address}</div>}

   </div>
  );
}

/* ---------------- app ---------------- */
function App(){
  const [rows,setRows]=useState(null);
  const [subs,setSubs]=useState(null);
  const [stack,setStack]=useState([{name:"board"}]);
  const view=stack[stack.length-1];
  const nav=v=>setStack(s=>[...s,v]);
  const back=()=>setStack(s=>s.length>1?s.slice(0,-1):s);
  const root=name=>setStack([{name}]);

  const [q,setQ]=useState(""),[region,setRegion]=useState(""),[client,setClient]=useState(""),
        [status,setStatus]=useState(""),[pri,setPri]=useState(""),[pm,setPm]=useState(""),[flagFilter,setFlag]=useState(""),[sort,setSort]=useState("urgent");
  const [editing,setEditing]=useState(null);
  const [editSub,setEditSub]=useState(null);
  const [pendingSubTarget,setPendingSubTarget]=useState(null);
  const [showSync,setShowSync]=useState(false);
  const [cfg]=useState(()=>{const r=lGet(CKEY);return r?safe(r):{followUp:1,dueSoon:10};});

  useEffect(()=>{initStore().then(d=>{setRows(d.rows);setSubs(d.subs);});},[]);

  if(!rows||!subs)return <div style={{padding:44,textAlign:"center",color:"var(--muted)",fontFamily:"Quicksand"}}>Loading your board… <span style={{color:"#ffb3d1"}}>♥</span></div>;

  const regions=[...new Set(rows.map(r=>r.region).filter(Boolean))].sort();
  const clients=[...new Set(rows.map(r=>r.client).filter(Boolean))].sort();

  function upsert(row){setRows(prev=>{const i=prev.findIndex(r=>r.id===row.id);
    const next=i>=0?prev.map(r=>r.id===row.id?row:r):[...prev,row];saveW(next,row);return next;});setEditing(null);}
  function remove(w){if(!confirm("Delete "+w.wo+"? This can't be undone."))return;
    setRows(prev=>{const next=prev.filter(r=>r.id!==w.id);delW(next,w.id);return next;});back();}
  function setStatusOf(w,st){const row={...w,status:st};setRows(prev=>{const next=prev.map(r=>r.id===w.id?row:r);saveW(next,row);return next;});}
  function addLog(w,text){const entry={ts:new Date().toISOString(),text};
    const row={...w,log:[...(w.log||[]),entry],lastContact:todayStr()};
    setRows(prev=>{const next=prev.map(r=>r.id===w.id?row:r);saveW(next,row);return next;});}
  function quickLog(w){addLog(w,"Contact logged");}
  function saveNotes(w,text){const row={...w,history:text};setRows(prev=>{const next=prev.map(r=>r.id===w.id?row:r);saveW(next,row);return next;});}
  function setAction(w,val){const row={...w,action:val};setRows(prev=>{const next=prev.map(r=>r.id===w.id?row:r);saveW(next,row);return next;});}
  function saveSub(sub){setSubs(prev=>{const i=prev.findIndex(s=>s.id===sub.id);
    const next=i>=0?prev.map(s=>s.id===sub.id?sub:s):[...prev,sub];saveS(next,sub);return next;});
    if(pendingSubTarget&&pendingSubTarget.onSaved){pendingSubTarget.onSaved(sub);}
    setPendingSubTarget(null);setEditSub(null);}
  function newSubFromWO(f,setF){setPendingSubTarget({onSaved:(sub)=>setF(p=>({...p,subId:sub.id}))});setEditSub(false);}
  function patchById(id,fn){setRows(prev=>{const next=prev.map(r=>r.id===id?{...r,...fn(r)}:r);const row=next.find(r=>r.id===id);saveW(next,row);return next;});}
  function addBid(w,subId){patchById(w.id,r=>((r.bids||[]).some(b=>b.subId===subId)?{}:{bids:[...(r.bids||[]),{subId,status:"reached out",note:""}]}));}
  function setBidStatus(w,subId,status){patchById(w.id,r=>({bids:(r.bids||[]).map(b=>b.subId===subId?{...b,status}:b)}));}
  function setBidNote(w,subId,note){patchById(w.id,r=>({bids:(r.bids||[]).map(b=>b.subId===subId?{...b,note}:b)}));}
  function dropBid(w,subId){patchById(w.id,r=>{const p={bids:(r.bids||[]).filter(b=>b.subId!==subId)};if(r.subId===subId)p.subId="";return p;});}
  function chooseBid(w,subId){patchById(w.id,r=>({subId}));}
  function newBidSub(w){setPendingSubTarget({onSaved:(sub)=>addBid(w,sub.id)});setEditSub(false);}

  const cur=view.name==="detail"?rows.find(r=>r.id===view.id):null;
  const curSub=view.name==="subdetail"?subs.find(s=>s.id===view.id):null;

  const counts={past_due:0,due_soon:0,follow_up:0};
  rows.forEach(w=>{if(w.status==="Complete")return;const k=statusFlag(w,cfg).key;if(counts[k]!=null)counts[k]++;});
  const rushList=rows.filter(w=>w.rush&&w.status!=="Complete");
  const actionCounts={};
  rows.forEach(w=>{if(w.status!=="Complete"&&w.action)actionCounts[w.action]=(actionCounts[w.action]||0)+1;});

  function filtered(){
    let v=rows.filter(w=>{
      if(w.status==="Complete")return false;
      if(region&&w.region!==region)return false;
      if(client&&w.client!==client)return false;
      if(pm&&w.pm!==pm)return false;
      if(status&&w.status!==status)return false;
      if(pri&&w.pri!==pri)return false;
      if(flagFilter){const FK=["past_due","due_soon","follow_up","rush"];
        if(FK.includes(flagFilter)){if(flagFilter==="rush"){if(!w.rush)return false;}else if(statusFlag(w,cfg).key!==flagFilter)return false;}
        else if(w.action!==flagFilter)return false;}
      if(q){const s=q.toLowerCase();const sub=subs.find(x=>x.id===w.subId);
        const hay=[w.wo,w.job,w.client,w.location,w.scope,w.contact,w.sub,sub&&sub.name].join(" ").toLowerCase();
        if(!hay.includes(s))return false;}
      return true;});
    v.sort((a,b)=>{if(sort==="urgent"){const d=severity(a,cfg)-severity(b,cfg);if(d)return d;return (parseD(a.due)||8e15)-(parseD(b.due)||8e15);}
      if(sort==="due")return (parseD(a.due)||8e15)-(parseD(b.due)||8e15);
      if(sort==="pri")return (a.pri||"P9").localeCompare(b.pri||"P9");return 0;});
    return v;
  }

  function exportCSV(){
    const cols=["wo","job","region","client","location","scope","sub","fm","contact","phone","nte","budget","actual","pri","rush","status","due","lastContact","next","history"];
    const esc=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    const csv=[cols.join(",")].concat(rows.map(r=>cols.map(c=>esc(r[c])).join(","))).join("\n");
    dl(csv,"work_orders.csv","text/csv");
  }
  function exportJSON(){dl(JSON.stringify({work_orders:rows,subs},null,2),"work_orders_backup.json","application/json");}
  function dl(t,n,ty){const b=new Blob([t],{type:ty}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);}

  const isDetail=view.name==="detail"||view.name==="subdetail";
  const deadlineRow=[{key:"past_due",label:"Past due",n:counts.past_due,c:"var(--pastdue)"},
    {key:"due_soon",label:"Due soon",n:counts.due_soon,c:"var(--duesoon)"},
    {key:"follow_up",label:"Gone quiet",n:counts.follow_up,c:"var(--followup)"}];
  const attentionRow=[{key:"rush",label:"Rush",n:rushList.length,c:"var(--rush)"}];

  return (
   <>
     <div className="top">
       {isDetail
        ? <button className="back" onClick={back}>{I.back} Back</button>
        : <>
          <h1><span className="bloom">♥</span> Work Order Board
            <span className="mode">{sync?<>● <b>Synced</b></>:<>○ <b>Local</b></>}</span></h1>
          <div className="tabs">
            {[["board","Active"],["completed","Completed"],["subs","Subs"]].map(([k,l])=>
              <button key={k} className={"tab"+(view.name===k?" on":"")} onClick={()=>root(k)}>{l}</button>)}
          </div>
          {view.name==="board"&&<>
           <div className="trlabel">Deadlines</div>
           <div className="triage">
             <button className="tcard clear" onClick={()=>setFlag("")} style={flagFilter?{}:{outline:"2px solid rgba(255,255,255,.6)"}}>
               <div className="n">{rows.filter(w=>w.status!=="Complete").length}</div><div className="l">All active</div></button>
             {deadlineRow.map(t=><button key={t.key} className={"tcard"+(flagFilter&&flagFilter!==t.key?" off":"")} style={{background:t.c}} onClick={()=>setFlag(flagFilter===t.key?"":t.key)}>
               <div className="n">{t.n}</div><div className="l">{t.label}</div></button>)}
           </div>
           <div className="trlabel">Attention</div>
           <div className="triage">
             {attentionRow.map(t=><button key={t.key} className={"tcard"+(flagFilter&&flagFilter!==t.key?" off":"")} style={{background:t.c}} onClick={()=>setFlag(flagFilter===t.key?"":t.key)}>
               <div className="n">{t.n}</div><div className="l">{t.label}</div></button>)}
             {ACTIONS.filter(a=>actionCounts[a]).map(a=><button key={a} className={"tcard"+(flagFilter&&flagFilter!==a?" off":"")} style={{background:"var(--action)"}} onClick={()=>setFlag(flagFilter===a?"":a)}>
               <div className="n">{actionCounts[a]}</div><div className="l">{actLabel(a)}</div></button>)}
           </div>
          </>}
        </>}
     </div>

     {view.name==="board"&&<>
       {rushList.length>0&&<div className="rushbox"><div className="inner">
         <h3>★ RUSH work orders<span className="cnt">{rushList.length}</span></h3>
         {rushList.map(w=>{const f=statusFlag(w,cfg);return (
           <div key={w.id} className="rushline" onClick={()=>nav({name:"detail",id:w.id})}>
             <span className="wo">{w.wo}</span>
             <span className="lc">{w.location||w.scope}</span>
             <span className="fl" style={{background:f.color}}>{f.label}</span></div>);})}
       </div></div>}

       <div className="controls">
         <div className="search">{I.search}<input placeholder="Search WO, client, site, sub…" value={q} onChange={e=>setQ(e.target.value)}/></div>
         <div className="filters">
           <div className="sel"><select value={sort} onChange={e=>setSort(e.target.value)}><option value="urgent">Most urgent</option><option value="due">By due date</option><option value="pri">By priority</option></select></div>
           <div className="sel"><select value={client} onChange={e=>setClient(e.target.value)}><option value="">All clients</option>{clients.map(c=><option key={c}>{c}</option>)}</select></div>
           <div className="sel"><select value={pri} onChange={e=>setPri(e.target.value)}><option value="">All priorities</option>{PRIS.filter(Boolean).map(p=><option key={p}>{p}</option>)}</select></div>
           <div className="sel"><select value={pm} onChange={e=>setPm(e.target.value)}><option value="">All PMs</option>{PMS.filter(Boolean).map(p=><option key={p}>{p}</option>)}</select></div>
           <div className="sel"><select value={region} onChange={e=>setRegion(e.target.value)}><option value="">All regions</option>{regions.map(r=><option key={r}>{r}</option>)}</select></div>
           <div className="sel"><select value={status} onChange={e=>setStatus(e.target.value)}><option value="">All statuses</option>{STATUSES.filter(s=>s!=="Complete").map(s=><option key={s}>{s}</option>)}</select></div>
         </div>
       </div>

       <div className="list">
         {filtered().length===0?<div className="empty"><div className="emptyheart">♥</div><h3>Nothing here</h3><p>No active work orders match these filters. Clear them, or add one with the + button.</p></div>
          :filtered().map(w=><Card key={w.id} w={w} cfg={cfg} onOpen={x=>nav({name:"detail",id:x.id})} onLog={quickLog}/>)}
       </div>

       <div className="foot">
         <button onClick={exportCSV}>Export CSV</button>
         <button onClick={exportJSON}>Export backup</button>
         {!sync&&<button onClick={()=>setShowSync(true)}>Turn on sync</button>}
       </div>
       <button className="fab" onClick={()=>setEditing(false)}>{I.plus} New</button>
     </>}

     {view.name==="completed"&&<div className="list">
       {rows.filter(w=>w.status==="Complete").length===0?<div className="empty"><div className="emptyheart">♥</div><h3>No completed work orders yet</h3><p>When you mark a job complete, it moves here for your records and off the active board.</p></div>
        :rows.filter(w=>w.status==="Complete").map(w=><Card key={w.id} w={w} cfg={cfg} onOpen={x=>nav({name:"detail",id:x.id})} onLog={quickLog}/>)}
     </div>}

     {view.name==="subs"&&<>
       <div className="list">
         {subs.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>{
           const active=rows.filter(r=>r.subId===s.id&&r.status!=="Complete").length;
           const c0=(s.contacts&&s.contacts[0])||{};
           return <div key={s.id} className="subrow" onClick={()=>nav({name:"subdetail",id:s.id})}>
             <div className="nm">{s.name}</div>
             {s.trade&&<div className="tr">{s.trade}</div>}
             <div className="ct">{c0.name?c0.name+(c0.phone?" · "+c0.phone:""):(c0.phone||"No contact info yet")} · {active} active job{active===1?"":"s"}</div>
           </div>;})}
       </div>
       <button className="fab" onClick={()=>setEditSub(false)}>{I.plus} New sub</button>
     </>}

     {view.name==="detail"&&cur&&<WODetail key={cur.id} w={cur} subs={subs} cfg={cfg}
        onEdit={setEditing} onDelete={remove}
        onComplete={w=>{setStatusOf(w,"Complete");back();}}
        onReopen={w=>setStatusOf(w,"Approved")}
        onAddLog={addLog} onSaveNotes={saveNotes} onSetAction={setAction}
        onAddBid={addBid} onSetBidStatus={setBidStatus} onSetBidNote={setBidNote}
        onChooseBid={chooseBid} onDropBid={dropBid} onNewBidSub={newBidSub}
        openSub={id=>nav({name:"subdetail",id})}/>}

     {view.name==="subdetail"&&curSub&&<SubDetail sub={curSub} rows={rows} cfg={cfg}
        onEdit={setEditSub} openWO={id=>nav({name:"detail",id})}/>}

     {editing!==null&&<EditSheet w={editing||null} subs={subs} onSave={upsert} onClose={()=>setEditing(null)} onNewSub={newSubFromWO}/>}
     {editSub!==null&&<SubEditSheet sub={editSub||null} onSave={saveSub} onClose={()=>{setEditSub(null);setPendingSubTarget(null);}}/>}
     {showSync&&<SyncSheet onClose={()=>setShowSync(false)}/>}
   </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
