<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#111a22; --muted:#5c6b7a; --faint:#8496a6;
  --line:#dfe4ea; --line2:#eaeef2; --header:#122b36; --header2:#1b3d4a;
  --pastdue:#d92d20; --duesoon:#e8820c; --rush:#e0347a; --followup:#c99700;
  --motion:#0f9d6b; --done:#7c8a99; --ok:#9aa9b6;
  --tap:#0f9d6b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:88px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--header);color:#eaf2f5;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
.top h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--motion);box-shadow:0 0 0 3px rgba(15,157,107,.25)}
.mode{margin-left:auto;font-size:11px;font-weight:500;color:#9fc4cf;display:flex;align-items:center;gap:5px}
.mode b{color:#eaf2f5;font-weight:600}
/* triage */
.triage{display:flex;gap:8px;margin-top:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.tcard{flex:0 0 auto;min-width:78px;border-radius:11px;padding:9px 12px;text-align:left;color:#fff;
  transition:transform .08s ease, filter .12s ease}
.tcard:active{transform:scale(.96)}
.tcard.off{filter:grayscale(.55) brightness(.82);opacity:.7}
.tcard .n{font-size:22px;font-weight:700;line-height:1;font-family:'IBM Plex Mono'}
.tcard .l{font-size:10.5px;font-weight:600;margin-top:4px;opacity:.95;letter-spacing:.2px}
.tcard.clear{background:rgba(255,255,255,.14);color:#eaf2f5}

/* controls */
.controls{padding:11px 16px 4px;display:flex;flex-direction:column;gap:9px;position:sticky;top:0;}
.searchrow{display:flex;gap:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:0 11px;height:42px}
.search input{border:none;outline:none;flex:1;background:none;color:var(--ink)}
.search svg{flex:0 0 auto;color:var(--faint)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.sel{position:relative;flex:0 0 auto}
.sel select{appearance:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  height:38px;padding:0 30px 0 12px;font-size:13.5px;font-weight:500;color:var(--ink);outline:none}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid var(--faint);
  border-bottom:2px solid var(--faint);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* list */
.list{padding:8px 16px 20px;display:flex;flex-direction:column;gap:11px;max-width:860px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;
  display:flex;box-shadow:0 1px 2px rgba(17,26,34,.04)}
.rail{flex:0 0 6px;align-self:stretch}
.body{flex:1;min-width:0;padding:12px 13px 11px}
.r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.3px;color:#fff;padding:3px 8px;border-radius:6px;white-space:nowrap}
.chip.dark{color:#3a2c00}
.pill{font-size:11px;font-weight:600;color:var(--muted);background:var(--line2);padding:3px 8px;border-radius:6px}
.wo{font-size:15px;font-weight:600;letter-spacing:.2px}
.spacer{flex:1}
.r2{margin-top:7px;font-size:13.5px;color:var(--muted);line-height:1.4}
.r2 .loc{color:var(--ink);font-weight:500}
.scope{margin-top:5px;font-size:13.5px;color:var(--ink);line-height:1.42;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:9px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
.meta b{color:var(--muted);font-weight:600}
.meta .due.late{color:var(--pastdue);font-weight:600}
.next{margin-top:9px;font-size:13px;color:var(--ink);background:#f5f8fa;border-left:3px solid var(--line);
  padding:7px 9px;border-radius:0 7px 7px 0;line-height:1.4}
.acts{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;
  font-size:12.5px;font-weight:600;border:1px solid var(--line);color:var(--muted);background:#fff}
.act:active{background:var(--line2)}
.act.call{border-color:#bfe6d5;color:#0b7a53;background:#eefaf4}
.act.log{border-color:#cfe0ec;color:#1668a8;background:#eef6fc}
.act svg{width:15px;height:15px}
.expand{padding:0 13px 13px;border-top:1px solid var(--line2);margin-top:2px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;margin-top:11px}
.dl dt{color:var(--faint);font-weight:600}
.dl dd{margin:0;color:var(--ink)}
.hist{margin-top:11px;font-size:12.5px;color:var(--muted);line-height:1.5;white-space:pre-wrap}
.hist .lab{color:var(--faint);font-weight:600;display:block;margin-bottom:3px}
.rowbtns{margin-top:12px;display:flex;gap:8px}
.link{font-size:12.5px;font-weight:600;color:var(--muted)}
.link.del{color:var(--pastdue)}
.caret{margin-left:6px;color:var(--faint);font-size:12px}

.empty{max-width:860px;margin:40px auto;text-align:center;color:var(--muted);padding:0 24px}
.empty h3{color:var(--ink);font-size:16px;margin:0 0 6px}

/* fab */
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:40;
  height:54px;padding:0 20px 0 16px;border-radius:16px;background:var(--tap);color:#fff;font-weight:600;
  font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(15,157,107,.4)}
.fab:active{transform:translateY(1px)}
.foot{max-width:860px;margin:0 auto 30px;padding:0 16px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.foot button{font-size:12px;font-weight:600;color:var(--faint)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,28,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0}
@media(min-width:640px){.sheet{border-radius:16px}}
.sheet header{position:sticky;top:0;background:var(--header);color:#eaf2f5;padding:15px 18px;
  display:flex;align-items:center;gap:12px;z-index:2}
.sheet header h2{margin:0;font-size:16px;font-weight:600;flex:1}
.sheet header .x{font-size:22px;color:#9fc4cf;line-height:1}
.form{padding:16px 18px 22px}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:10px 11px;color:var(--ink);outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--header2);box-shadow:0 0 0 3px rgba(27,61,74,.12)}
.fg textarea{min-height:70px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.rushtog{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:10px 11px}
.rushtog input{width:20px;height:20px;accent-color:var(--rush)}
.rushtog span{font-size:13.5px;font-weight:600}
.save{width:100%;height:50px;border-radius:12px;background:var(--tap);color:#fff;font-size:15px;font-weight:600;margin-top:6px}
.save:active{transform:translateY(1px)}
.hint{font-size:12px;color:var(--faint);line-height:1.5;margin:2px 0 14px}
.syncbox{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;margin:2px 0 12px;font-size:13px;line-height:1.5;color:var(--muted)}
.syncbox code{font-family:'IBM Plex Mono';background:var(--line2);padding:1px 5px;border-radius:4px;font-size:12px;color:var(--ink)}
.syncbox b{color:var(--ink)}
</style>
</head>

/* ---------------- flag logic (mirrors the spreadsheet) ---------------- */
const FLAG={
 past_due:{key:"past_due",label:"PAST DUE",color:"var(--pastdue)"},
 due_soon:{key:"due_soon",label:"DUE SOON",color:"var(--duesoon)"},
 rush:{key:"rush",label:"RUSH",color:"var(--rush)"},
 follow_up:{key:"follow_up",label:"FOLLOW UP",color:"var(--followup)",dark:true},

 done:{key:"done",label:"DONE",color:"var(--done)"},
 ok:{key:"ok",label:"ON TRACK",color:"var(--ok)"}
};
const DAY=86400000;
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function parseD(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function daysBetween(a,b){return Math.round((a-b)/DAY);}
function statusFlag(w,cfg){
  const t=today();
  if(w.status==="Complete")return {...FLAG.done};
  const due=parseD(w.due), lc=parseD(w.lastContact);
  const active=["Scheduled","In Progress","Parts Ordered"].includes(w.status);
  if(due && due<t && !active){return {...FLAG.past_due,extra:daysBetween(t,due)+"d late"};}
  if(due && due>=t && daysBetween(due,t)<=cfg.dueSoon && !active){return {...FLAG.due_soon,extra:"in "+daysBetween(due,t)+"d"};}

async function delRow(rows,id){

  return (
   <div className="card">
     <div className="rail" style={{background:f.color}}/>
     <div className="body">
       <div className="r1">
         <span className="chip" style={{background:f.color,color:f.dark?"#3a2c00":"#fff"}}>
           {f.label}{f.extra?" · "+f.extra:""}</span>
         {w.rush && f.key!=="rush" && <span className="chip" style={{background:"var(--rush)"}}>RUSH</span>}
         {w.pri && <span className="pill">{w.pri}</span>}
         <span className="spacer"/>
         <button className="wo mono" onClick={()=>setOpen(o=>!o)}>{w.wo}<span className="caret">{open?"▲":"▼"}</span></button>
       </div>
       <div className="r2"><span className="loc">{w.location||"—"}</span>{w.client?" · "+w.client:""}</div>
       {w.scope && <div className="scope">{w.scope}</div>}
       <div className="meta">
         {w.due && <span className={"due"+(late?" late":"")}><b>Due</b> {fmtDate(w.due)}</span>}
         <span><b>Status</b> {w.status}</span>
         {dq!=null && <span><b>Quiet</b> {dq}d</span>}
         {w.sub && <span><b>Sub</b> {w.sub}</span>}
       </div>
       {w.next && <div className="next">{w.next}</div>}
       <div className="acts">
         {w.phone && <a className="act call" href={"tel:"+w.phone.replace(/[^0-9+]/g,"")}>{I.phone} Call{w.contact?" "+w.contact.split(" ")[0]:""}</a>}
         <button className="act log" onClick={()=>onLog(w)}>{I.check} Log contact</button>
         <button className="act" onClick={()=>onEdit(w)}>{I.edit} Edit</button>
       </div>
     </div>
     {open &&
       <div className="expand" style={{flexBasis:"100%"}}>
         <dl className="dl">
           {w.job && <><dt>Job #</dt><dd className="mono">{w.job}</dd></>}
           {w.fm && <><dt>FM</dt><dd>{w.fm}</dd></>}
           {w.contact && <><dt>Contact</dt><dd>{w.contact}{w.phone?" · "+w.phone:""}</dd></>}
           {w.nte && <><dt>NTE</dt><dd>{w.nte}</dd></>}
           {w.lastContact && <><dt>Last contact</dt><dd>{fmtDate(w.lastContact)}</dd></>}
           <dt>Region</dt><dd>{w.region||"—"}</dd>
         </dl>
         {w.history && <div className="hist"><span className="lab">History</span>{w.history}</div>}
         <div className="rowbtns">
           <button className="link del" onClick={()=>onDelete(w)}>Delete work order</button>
         </div>
       </div>}
   </div>
  );
}

/* ---------------- edit sheet ---------------- */
function EditSheet({w,onSave,onClose}){
  const blank={id:uid(),wo:"",job:"",region:"",client:"",location:"",scope:"",sub:"",fm:"",contact:"",phone:"",nte:"",pri:"",rush:false,status:"New",due:"",lastContact:"",next:"",history:""};
  const [f,setF]=useState(w||blank);
  const set=(k)=>(e)=>setF(p=>({...p,[k]:e.target.type==="checkbox"?e.target.checked:e.target.value}));
  const isNew=!w;
  return (
   <div className="scrim" onClick={onClose}>
     <div className="sheet" onClick={e=>e.stopPropagation()}>
       <header><h2>{isNew?"New work order":"Edit "+f.wo}</h2><button className="x" onClick={onClose}>✕</button></header>
       <div className="form">
         <div className="two">
           <div className="fg"><label>WO #</label><input value={f.wo} onChange={set("wo")} placeholder="0205-1000"/></div>
           <div className="fg"><label>Job #</label><input value={f.job} onChange={set("job")} placeholder="51960"/></div>
         </div>
         <div className="fg"><label>Location</label><input value={f.location} onChange={set("location")} placeholder="Address, city, state"/></div>
         <div className="fg"><label>Scope of work</label><textarea value={f.scope} onChange={set("scope")}/></div>
         <div className="two">
           <div className="fg"><label>Client</label><input value={f.client} onChange={set("client")} placeholder="CBRE - AT&T"/></div>
           <div className="fg"><label>Region</label><input value={f.region} onChange={set("region")} placeholder="FL-West"/></div>
         </div>
         <div className="fg"><label>Sub / vendor</label><input value={f.sub} onChange={set("sub")}/></div>
         <div className="three">
           <div className="fg"><label>Status</label><select value={f.status} onChange={set("status")}>{STATUSES.map(s=><option key={s}>{s}</option>)}</select></div>
           <div className="fg"><label>Priority</label><select value={f.pri} onChange={set("pri")}>{PRIS.map(p=><option key={p} value={p}>{p||"—"}</option>)}</select></div>
           <div className="fg"><label>NTE cap</label><input value={f.nte} onChange={set("nte")} placeholder="$350"/></div>
         </div>
         <div className="two">
           <div className="fg"><label>Due (complete by)</label><input type="date" value={f.due} onChange={set("due")}/></div>
           <div className="fg"><label>Last contact</label><input type="date" value={f.lastContact} onChange={set("lastContact")}/></div>
         </div>
         <div className="two">
           <div className="fg"><label>Site contact</label><input value={f.contact} onChange={set("contact")}/></div>
           <div className="fg"><label>Phone</label><input value={f.phone} onChange={set("phone")} placeholder="407-456-0758"/></div>
         </div>
         <div className="fg"><label>FM (escalation)</label><input value={f.fm} onChange={set("fm")}/></div>
         <div className="fg"><label>Next action</label><textarea value={f.next} onChange={set("next")}/></div>
         <div className="fg"><label>History / notes</label><textarea value={f.history} onChange={set("history")} style={{minHeight:"90px"}}/></div>
         <div className="fg"><label className="rushtog"><input type="checkbox" checked={f.rush} onChange={set("rush")}/><span>Mark as RUSH — jumps to the top</span></label></div>
         <button className="save" onClick={()=>{if(!f.wo.trim())f.wo="(no WO #)";onSave(f);}}>{isNew?"Add work order":"Save changes"}</button>
       </div>
     </div>
   </div>
  );
}

/* ---------------- sync info sheet ---------------- */
function SyncSheet({onClose}){
  return (
   <div className="scrim" onClick={onClose}>
     <div className="sheet" onClick={e=>e.stopPropagation()}>
       <header><h2>Turn on phone ↔ computer sync</h2><button className="x" onClick={onClose}>✕</button></header>
       <div className="form">
         <div className="syncbox">
           Right now your board saves to <b>this device only</b>. To sync it across your phone and computer,
           connect a free Supabase database — about 15 minutes, one time.
         </div>
         <div className="syncbox">
           <b>1.</b> Make a free project at <b>supabase.com</b>.<br/>
           <b>2.</b> In the SQL editor, run:<br/>
           <code>create table work_orders (id text primary key, wo text, job text, region text, client text, location text, scope text, sub text, fm text, contact text, phone text, nte text, pri text, rush bool, status text, due text, "lastContact" text, next text, history text, created_at timestamptz default now());</code><br/><br/>
           <code>alter table work_orders enable row level security;</code><br/>
           <code>create policy "all" on work_orders for all using (true) with check (true);</code>
         </div>
         <div className="syncbox">
           <b>3.</b> In <b>Project Settings → API</b>, copy your <b>Project URL</b> and <b>anon public key</b>.<br/>
           <b>4.</b> Paste them into the top of <code>index.html</code> (the SUPABASE_URL / SUPABASE_ANON_KEY lines) and redeploy.<br/><br/>
           That's it — open it on any device and it's the same board. Full steps are in the README.
         </div>
       </div>
     </div>
   </div>
  );
}

/* ---------------- app ---------------- */
function App(){
  const [rows,setRows]=useState(null);
  const [q,setQ]=useState("");
  const [region,setRegion]=useState("");
  const [status,setStatus]=useState("");
  const [flagFilter,setFlag]=useState("");
  const [sort,setSort]=useState("urgent");
  const [editing,setEditing]=useState(null);
  const [showSync,setShowSync]=useState(false);
  const [cfg,setCfg]=useState(()=>{const r=localGet(CKEY);return r?JSON.parse(r):{followUp:7,dueSoon:10};});

  useEffect(()=>{initStore().then(setRows);},[]);
  useEffect(()=>{localSet(CKEY,JSON.stringify(cfg));},[cfg]);

  if(!rows)return <div style={{padding:40,textAlign:"center",color:"var(--muted)"}}>Loading board…</div>;

  const regions=[...new Set(rows.map(r=>r.region).filter(Boolean))].sort();

  function upsert(row){
    setRows(prev=>{const i=prev.findIndex(r=>r.id===row.id);
      const next=i>=0?prev.map(r=>r.id===row.id?row:r):[...prev,row];
      saveRow(next,row);return next;});
    setEditing(null);
  }
  function remove(w){
    if(!confirm("Delete "+w.wo+"? This can't be undone."))return;
    setRows(prev=>{const next=prev.filter(r=>r.id!==w.id);delRow(next,w.id);return next;});
  }
  function log(w){
    const row={...w,lastContact:todayStr()};
    setRows(prev=>{const next=prev.map(r=>r.id===w.id?row:r);saveRow(next,row);return next;});
  }

  const counts={past_due:0,due_soon:0,rush:0,follow_up:0};
  rows.forEach(w=>{const f=statusFlag(w,cfg).key;if(counts[f]!=null)counts[f]++;if(w.rush&&w.status!=="Complete")counts.rush++;});

  let view=rows.filter(w=>{
    if(region&&w.region!==region)return false;
    if(status&&w.status!==status)return false;
    if(flagFilter){if(flagFilter==="rush"){if(!(w.rush&&w.status!=="Complete"))return false;}
      else if(statusFlag(w,cfg).key!==flagFilter)return false;}
    if(q){const s=q.toLowerCase();const hay=[w.wo,w.job,w.client,w.location,w.scope,w.contact,w.sub].join(" ").toLowerCase();
      if(!hay.includes(s))return false;}
    return true;
  });
  view.sort((a,b)=>{
    if(sort==="urgent"){const d=severity(a,cfg)-severity(b,cfg);if(d)return d;
      return (parseD(a.due)||8e15)-(parseD(b.due)||8e15);}
    if(sort==="due")return (parseD(a.due)||8e15)-(parseD(b.due)||8e15);
    if(sort==="pri")return (a.pri||"P9").localeCompare(b.pri||"P9");
    return 0;
  });

  const triage=[
    {key:"past_due",label:"Past due",n:counts.past_due,c:"var(--pastdue)"},
    {key:"rush",label:"Rush",n:counts.rush,c:"var(--rush)"},
    {key:"due_soon",label:"Due soon",n:counts.due_soon,c:"var(--duesoon)"},
    {key:"follow_up",label:"Follow up",n:counts.follow_up,c:"var(--followup)"}
  ];

  function exportCSV(){
    const cols=["wo","job","region","client","location","scope","sub","fm","contact","phone","nte","pri","rush","status","due","lastContact","next","history"];
    const esc=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    const csv=[cols.join(",")].concat(rows.map(r=>cols.map(c=>esc(r[c])).join(","))).join("\n");
    dl(csv,"work_orders.csv","text/csv");
  }
  function exportJSON(){dl(JSON.stringify(rows,null,2),"work_orders.json","application/json");}
  function dl(text,name,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}

  return (
   <>
     <div className="top">
       <h1><span className="dot"/>Work Order Board
         <span className="mode">{sync?<>● <b>Synced</b></>:<>○ <b>Local</b></>}</span>
       </h1>
       <div className="triage">
         <button className={"tcard clear"+(flagFilter?"":" ")} onClick={()=>setFlag("")}
           style={flagFilter?{}:{outline:"2px solid rgba(255,255,255,.5)"}}>
           <div className="n">{rows.filter(w=>w.status!=="Complete").length}</div><div className="l">All open</div></button>
         {triage.map(t=>
           <button key={t.key} className={"tcard"+(flagFilter&&flagFilter!==t.key?" off":"")}
             style={{background:t.c}} onClick={()=>setFlag(flagFilter===t.key?"":t.key)}>
             <div className="n">{t.n}</div><div className="l">{t.label}</div></button>)}
       </div>
     </div>

     <div className="controls">
       <div className="searchrow">
         <div className="search">{I.search}<input placeholder="Search WO, client, site, sub…" value={q} onChange={e=>setQ(e.target.value)}/></div>
       </div>
       <div className="filters">
         <div className="sel"><select value={sort} onChange={e=>setSort(e.target.value)}>
           <option value="urgent">Most urgent</option><option value="due">By due date</option><option value="pri">By priority</option></select></div>
         <div className="sel"><select value={region} onChange={e=>setRegion(e.target.value)}>
           <option value="">All regions</option>{regions.map(r=><option key={r}>{r}</option>)}</select></div>
         <div className="sel"><select value={status} onChange={e=>setStatus(e.target.value)}>
           <option value="">All statuses</option>{STATUSES.map(s=><option key={s}>{s}</option>)}</select></div>
       </div>
     </div>

     <div className="list">
       {view.length===0
        ? <div className="empty"><h3>Nothing here</h3><p>No work orders match these filters. Clear them, or add one with the + button.</p></div>
        : view.map(w=><Card key={w.id} w={w} cfg={cfg} onEdit={setEditing} onLog={log} onDelete={remove}/>)}
     </div>

     <div className="foot">
       <button onClick={exportCSV}>Export CSV</button>
       <button onClick={exportJSON}>Export JSON (backup)</button>
       {!sync && <button onClick={()=>setShowSync(true)}>Turn on sync</button>}
     </div>

     <button className="fab" onClick={()=>setEditing(false)}>{I.plus} New</button>

     {editing!==null && <EditSheet w={editing||null} onSave={upsert} onClose={()=>setEditing(null)}/>}
     {showSync && <SyncSheet onClose={()=>setShowSync(false)}/>}
   </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
